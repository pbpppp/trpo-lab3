name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrpoLab3.Tests/TrpoLab3.Tests.csproj

      - name: Build
        run: dotnet build TrpoLab3.Tests/TrpoLab3.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test TrpoLab3.Tests/TrpoLab3.Tests.csproj --configuration Release --no-build --verbosity normal

  build-wpf:
    name: Build WPF
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj

      - name: Build
        run: dotnet build TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj --configuration Release --no-restore

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrpoLab5.WebApp/TrpoLab5.WebApp.csproj

      - name: Build
        run: dotnet build TrpoLab5.WebApp/TrpoLab5.WebApp.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TrpoLab5.WebApp/TrpoLab5.WebApp.csproj --configuration Release --no-restore --output publish/web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trpo-lab5-web
          path: publish/web

  publish:
    name: Publish win-x64
    needs: [ test, build-wpf ]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trpo-lab4-win-x64
          path: publish/win-x64

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ publish, build-web ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WPF artifact
        uses: actions/download-artifact@v4
        with:
          name: trpo-lab4-win-x64
          path: release/win-x64

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: trpo-lab5-web
          path: release/web

      - name: Pack WPF
        run: |
          cd release/win-x64
          zip -r ../trpo-lab4-win-x64.zip .

      - name: Pack web
        run: |
          cd release/web
          zip -r ../trpo-lab5-web.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v3.0
          files: |
            release/trpo-lab4-win-x64.zip
            release/trpo-lab5-web.zip
          generate_release_notes: true
