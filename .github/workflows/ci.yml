name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrpoLab3.Tests/TrpoLab3.Tests.csproj

      - name: Build
        run: dotnet build TrpoLab3.Tests/TrpoLab3.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test TrpoLab3.Tests/TrpoLab3.Tests.csproj --configuration Release --no-build --verbosity normal

  build-wpf:
    name: Build WPF
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj

      - name: Build
        run: dotnet build TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj --configuration Release --no-restore

  publish:
    name: Publish win-x64
    needs: [ test, build-wpf ]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish TrpoLab4.WpfApp/TrpoLab4.WpfApp.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trpo-lab4-win-x64
          path: publish/win-x64

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trpo-lab4-win-x64
          path: release/win-x64

      - name: Pack
        run: |
          cd release/win-x64
          zip -r ../trpo-lab4-win-x64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/trpo-lab4-win-x64.zip
          generate_release_notes: true
